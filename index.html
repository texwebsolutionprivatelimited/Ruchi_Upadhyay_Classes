<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruchi Upadhyay Classes - IIT-JEE, NEET & Board Coaching</title>
  <meta name="description"
    content="Premium Chemistry coaching for Class 10, Class 12, IIT-JEE, NEET, Engineering Chemistry & Environmental Science. Learn with expert educator Ruchi Upadhyay through comprehensive video lectures, high-quality notes, and mock tests." />
  <meta name="author" content="Ruchi Upadhyay Classes" />

  <meta property="og:title" content="Ruchi Upadhyay Classes" />
  <meta property="og:description"
    content="Premium Chemistry coaching for Class 10, Class 12, IIT-JEE, NEET, Engineering Chemistry & Environmental Science. Learn with expert educator Ruchi Upadhyay." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/ruchi-logo.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ruchi Upadhyay Classes" />
  <meta name="twitter:description"
    content="Premium Chemistry coaching for Class 10, Class 12, IIT-JEE, NEET, Engineering Chemistry & Environmental Science." />
  <meta name="twitter:image" content="/ruchi-logo.png" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .initial-loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      z-index: 99999;
      font-family: system-ui, -apple-system, sans-serif;
    }
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body, .initial-loader-wrapper {
        background-color: #0b0505;
      }
      .loading-heading {
        color: #f3f4f6 !important;
      }
      .glass-path {
        stroke: #f43f5e !important;
        opacity: 0.4;
      }
    }
    .initial-loader-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .orbital-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px dashed rgba(153, 27, 27, 0.2);
    }
    .orbital-ring-1 {
      animation: spin 8s linear infinite;
    }
    .orbital-ring-2 {
      border-color: rgba(249, 115, 22, 0.15);
      transform: rotate(45deg);
      animation: spin-reverse 12s linear infinite;
    }
    .electron {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: spin 4s linear infinite;
    }
    .electron::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #991B1B;
      box-shadow: 0 0 15px rgba(153, 27, 27, 0.6);
    }
    .electron-2 {
      transform: rotate(120deg);
      animation: spin-reverse 6s linear infinite;
    }
    .electron-2::before {
      background-color: #F97316;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
    }
    .flask-svg {
      width: 80%;
      height: 80%;
      z-index: 10;
      filter: drop-shadow(0 0 10px rgba(153, 27, 27, 0.15));
    }
    .glass-path {
      stroke: #991B1B;
      opacity: 0.3;
    }
    .glass-reflection {
      position: absolute;
      width: 18%;
      height: 35%;
      background: linear-gradient(to right, rgba(255,255,255,0.25), transparent);
      transform: rotate(-22deg);
      top: 30%;
      left: 28%;
      border-radius: 50%;
      filter: blur(1px);
      pointer-events: none;
      z-index: 20;
    }
    .loading-text-container {
      text-align: center;
      margin-top: 24px;
      padding: 0 16px;
      max-width: 300px;
      box-sizing: border-box;
    }
    .loading-welcome {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: #6b7280;
      letter-spacing: 0.5px;
      font-family: 'Sora', system-ui, -apple-system, sans-serif;
    }
    .loading-heading {
      margin: 4px 0 10px 0;
      font-size: 18px;
      font-weight: 800;
      color: #e11d48;
      background: linear-gradient(135deg, #991b1b 0%, #e11d48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      font-family: 'Sora', system-ui, -apple-system, sans-serif;
      line-height: 1.2;
    }
    .loading-subheading {
      margin: 0;
      font-size: 9px;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      animation: pulse 1.5s ease-in-out infinite;
      text-align: center;
    }
    
    /* Responsive styling for larger tablets/desktops */
    @media (min-width: 480px) {
      .loading-text-container {
        max-width: 420px;
      }
      .loading-welcome {
        font-size: 17px;
      }
      .loading-heading {
        font-size: 26px;
      }
      .loading-subheading {
        font-size: 11px;
      }
    }
    @media (min-width: 768px) {
      .loading-text-container {
        max-width: 550px;
      }
      .loading-welcome {
        font-size: 22px;
      }
      .loading-heading {
        font-size: 34px;
      }
      .loading-subheading {
        font-size: 13px;
      }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    /* Flask Inner animations */
    @keyframes initial-slosh {
      0%, 100% { d: path('M20 70 C 32 67, 42 73, 50 70 C 58 67, 68 73, 80 70 L 83 78 A 3 3 0 0 1 80 81 H 20 A 3 3 0 0 1 17 78 Z'); }
      50% { d: path('M20 70 C 32 73, 42 67, 50 70 C 58 73, 68 67, 80 70 L 83 78 A 3 3 0 0 1 80 81 H 20 A 3 3 0 0 1 17 78 Z'); }
    }
    @keyframes initial-bubble-1 {
      0% { transform: translateY(0) scale(0.4); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
    }
    @keyframes initial-bubble-2 {
      0% { transform: translateY(0) scale(0.3); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(-52px) scale(1); opacity: 0; }
    }
    @keyframes initial-bubble-3 {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-30px) scale(1.3); opacity: 0; }
    }
    @keyframes initial-bubble-4 {
      0% { transform: translateY(0) scale(0.4); opacity: 0; }
      25% { opacity: 1; }
      85% { opacity: 0.9; }
      100% { transform: translateY(-45px) scale(0.8); opacity: 0; }
    }
    @keyframes initial-steam {
      0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
      50% { opacity: 0.4; transform: translateY(-10px) translateX(2px) scale(1.1); }
      100% { transform: translateY(-22px) translateX(-2px) scale(1.3); opacity: 0; }
    }
    .liquid-path {
      animation: initial-slosh 2.5s ease-in-out infinite;
    }
    .bubble-1 {
      animation: initial-bubble-1 1.8s ease-in-out infinite;
      transform-origin: 45px 74px;
    }
    .bubble-2 {
      animation: initial-bubble-2 2.2s ease-in-out infinite;
      transform-origin: 56px 76px;
    }
    .bubble-3 {
      animation: initial-bubble-3 1.5s ease-in-out infinite;
      transform-origin: 34px 75px;
    }
    .bubble-4 {
      animation: initial-bubble-4 2s ease-in-out infinite;
      transform-origin: 63px 73px;
    }
    .steam-path-1 {
      animation: initial-steam 2.5s ease-in-out infinite;
      transform-origin: 48px 10px;
    }
    .steam-path-2 {
      animation: initial-steam 2.5s ease-in-out infinite;
      animation-delay: 1.2s;
      transform-origin: 52px 12px;
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Premium Chemistry Loader shown during initial script download -->
    <div class="initial-loader-wrapper">
      <div class="initial-loader-container">
        <!-- Orbital Atom Rings -->
        <div class="orbital-ring orbital-ring-1"></div>
        <div class="orbital-ring orbital-ring-2"></div>
        <div class="electron electron-1"></div>
        <div class="electron electron-2"></div>

        <!-- Beaker / Flask SVG -->
        <svg viewBox="0 0 100 100" class="flask-svg">
          <!-- Steam -->
          <path d="M48 10 Q50 6 52 10 Q54 14 50 18" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" class="steam-path-1" />
          <path d="M52 12 Q54 8 50 12 Q48 16 52 20" fill="none" stroke="#991B1B" stroke-width="2.5" stroke-linecap="round" class="steam-path-2" />
          
          <!-- Flask Outer Glass Frame -->
          <path d="M38 20 H62 M41 20 V33 L18 78 A 4 4 0 0 0 22 83 H78 A 4 4 0 0 0 82 78 L59 33 V20" fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="glass-path" />

          <!-- Markings -->
          <line x1="33" y1="55" x2="38" y2="55" stroke="#e11d48" stroke-width="2" opacity="0.3" />
          <line x1="28" y1="65" x2="35" y2="65" stroke="#e11d48" stroke-width="2" opacity="0.3" />
          <line x1="23" y1="75" x2="30" y2="75" stroke="#e11d48" stroke-width="2" opacity="0.3" />

          <!-- Chemical Liquid -->
          <path d="M20 70 C 32 67, 42 73, 50 70 C 58 67, 68 73, 80 70 L 83 78 A 3 3 0 0 1 80 81 H 20 A 3 3 0 0 1 17 78 Z" fill="url(#initialLiquidGrad)" class="liquid-path" />

          <!-- Bubbles -->
          <circle cx="45" cy="74" r="3.5" fill="url(#initialBubbleGrad)" class="bubble-1" />
          <circle cx="56" cy="76" r="2.5" fill="url(#initialBubbleGrad)" class="bubble-2" />
          <circle cx="34" cy="75" r="4" fill="url(#initialBubbleGrad)" class="bubble-3" />
          <circle cx="63" cy="73" r="3" fill="url(#initialBubbleGrad)" class="bubble-4" />

          <defs>
            <linearGradient id="initialLiquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#991B1B" />
              <stop offset="100%" stop-color="#E11D48" />
            </linearGradient>
            <linearGradient id="initialBubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.9)" />
              <stop offset="100%" stop-color="rgba(153,27,27,0.4)" />
            </linearGradient>
          </defs>
        </svg>

        <!-- Glass Reflection -->
        <div class="glass-reflection"></div>
      </div>
      
      <!-- Text Container -->
      <div class="loading-text-container">
        <h2 class="loading-welcome">Welcome to</h2>
        <h1 class="loading-heading">Ruchi Upadhyay Classes</h1>
        <p class="loading-subheading">Synthesizing Chemistry...</p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
